[package]
name = "server"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "discard"
path = "src/main.rs"

[dependencies]
shared = { path = "../shared" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
thiserror.workspace = true
uuid.workspace = true
chrono.workspace = true
axum = { version = "0.8.9", features = ["ws", "multipart", "macros"] }
tower-http = { version = "0.7.1", features = ["fs", "cors", "trace", "limit"] }
futures-util = "0.3.34"
dashmap = "6.2.1"
mime_guess = "2.0.5"
rand = "0.10.3"
base64 = "0.22.1"
hex = "0.4.3"
blake3 = "1.8.7"
iroh = "1.3.0"
iroh-blobs = "0.103.1"
iroh-gossip = "0.101.0"
iroh-tickets = "1.0.0"
rust-embed = { version = "8.13.0", optional = true, features = ["interpolate-folder-path"] }

[features]
embed-ui = ["dep:rust-embed"]
