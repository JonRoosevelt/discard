name: release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build web
        working-directory: web
        run: npm ci && npm run build

      - name: Package macOS
        run: |
          [ "$GITHUB_REF_TYPE" = tag ] && export VERSION="${GITHUB_REF_NAME#v}"
          bash scripts/package-macos.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Discard-macos
          path: dist/Discard-*.dmg
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Package Linux
        run: |
          [ "$GITHUB_REF_TYPE" = tag ] && export VERSION="${GITHUB_REF_NAME#v}"
          bash scripts/package-linux.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Discard-linux
          path: dist/*
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Attach binaries to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.dmg dist/*.tar.gz \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
